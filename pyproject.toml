[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-keyword-matcher"
version = "1.0.0"
description = "Transparent, truth-preserving resume and job-description matching with ATS-style heuristics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mir Raza Abbas"}]
keywords = ["resume", "ats", "job-search", "nlp", "career"]
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=6,<7", "python-docx>=1.2,<2"]

[project.scripts]
resume-ats = "app:main"

[project.urls]
Homepage = "https://github.com/mirrazaabbas/ai-resume-keyword-matcher"
Repository = "https://github.com/mirrazaabbas/ai-resume-keyword-matcher"

[tool.setuptools]
py-modules = ["app", "ats", "analysis", "documents", "requirements", "semantic", "reporting", "ai_features", "ai_platform"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["app", "ats", "analysis", "documents", "requirements", "semantic", "reporting"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "def main\\(\\) -> None:",
  "if __name__ == .__main__.:",
]
