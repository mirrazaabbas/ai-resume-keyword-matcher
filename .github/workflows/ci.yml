name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality, document and build tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt ".[documents]" build
      - name: Compile sources
        run: python -m compileall -q app.py ats.py analysis.py documents.py requirements.py semantic.py reporting.py tests
      - name: Lint
        run: ruff check . --output-format=github
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=80
      - name: Smoke test reports
        run: python app.py sample_resume.txt sample_job.txt --format json --json /tmp/report.json --html /tmp/report.html
      - name: Build installable package
        run: python -m build
      - name: Install wheel and smoke-test CLI
        run: |
          python -m pip install --force-reinstall "dist/ai_resume_keyword_matcher-"*.whl
          resume-ats --help
